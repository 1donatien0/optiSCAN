name: CI — Build, Test & Publish

on:
  push:
    branches: [ main, dev, win ]
  pull_request:
    branches: [ main, dev, win ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore optiSCAN.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build optiSCAN.sln --configuration Release --no-restore

      - name: Run tests (Release)
        run: >
          dotnet test optiSCAN.Tests/optiSCAN.Tests.csproj
          --configuration Release
          --no-build
          --settings optiSCAN.Tests/coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 14

      - name: Code coverage summary and threshold
        if: always()
        shell: pwsh
        run: |
          $floor = 0.40
          $target = 0.50
          $file = Get-ChildItem -Path TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) {
            Write-Error "No coverage file found."
            exit 1
          }
          [xml]$xml = Get-Content $file.FullName
          $lineRate = [double]$xml.coverage.'line-rate'
          $branchRate = [double]$xml.coverage.'branch-rate'
          Write-Host ("Line coverage: {0:P1} (floor {1:P0}, target {2:P0})" -f $lineRate, $floor, $target)
          Write-Host ("Branch coverage: {0:P1}" -f $branchRate)

          # T-1 : ventilation par assembly (informatif, non bloquant). Les moteurs coeur
          # (optiSCAN.IPC, services de scan/quarantaine/crypto) doivent viser >= 80 %.
          $coreTarget = 0.80
          Write-Host "--- Couverture par assembly ---"
          foreach ($pkg in $xml.coverage.packages.package) {
            $name = [string]$pkg.name
            $rate = [double]$pkg.'line-rate'
            Write-Host ("  {0,-32} {1:P1}" -f $name, $rate)
            if ($name -like '*optiSCAN.IPC*' -and $rate -lt $coreTarget) {
              Write-Host ("::warning::Couverture de {0} sous la cible coeur ({1:P0})." -f $name, $coreTarget)
            }
          }

          if ($lineRate -lt $target) {
            Write-Host "::warning::Line coverage below progressive target ($([int]($target * 100))%)."
          }
          if ($lineRate -lt $floor) {
            Write-Error "Line coverage below minimum floor."
            exit 1
          }

      - name: Build (Debug)
        run: dotnet build optiSCAN.sln --configuration Debug --no-restore

      - name: Upload Release build (dev)
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optiSCAN-Release-build-${{ github.sha }}
          path: optiSCAN.WinUI/bin/Release/
          retention-days: 7

  publish:
    name: Publish win-x64 (Release)
    runs-on: windows-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore optiSCAN.sln

      - name: Clean publish folders
        shell: pwsh
        run: pwsh -File scripts/clean-before-publish.ps1 -IncludeObj -IncludeCiPublish

      - name: Fetch ClamAV, YARA and signatures (freshclam)
        shell: pwsh
        run: pwsh -File scripts/fetch-runtime-deps.ps1 -RunFreshclam -FreshclamTimeoutMinutes 45

      - name: Build AMSI provider (x64 Release)
        shell: pwsh
        continue-on-error: true
        run: pwsh -File scripts/build-amsi.ps1

      # Framework-dependent (profil FolderProfile) : installateur leger ; setup.iss installe
      # .NET 10 Desktop Runtime + Windows App Runtime 1.8 s'ils manquent sur le poste.
      - name: Publish win-x64 (framework-dependent)
        run: >
          dotnet publish optiSCAN.WinUI/optiSCAN.WinUI.csproj
          --configuration Release
          -p:PublishProfile=FolderProfile
          --output publish/win-x64

      - name: Publish protection service (win-x64)
        run: >
          dotnet publish optiSCAN.Service/optiSCAN.Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=false
          --output publish/win-x64

      - name: Stage runtime deps into publish folder
        shell: pwsh
        run: pwsh -File scripts/stage-runtime-deps.ps1 -PublishDir publish/win-x64

      - name: Stage AMSI provider DLL
        shell: pwsh
        run: pwsh -File scripts/stage-amsi.ps1 -PublishDir publish/win-x64

      - name: Verify runtime dependencies (ClamAV + YARA)
        shell: pwsh
        run: pwsh -File scripts/verify-runtime-deps.ps1 -PublishDir publish/win-x64

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: pwsh -File installer/build-release-setup.ps1 -SkipPublish -PublishDir publish/win-x64

      - name: Sign publish artifacts (optional)
        shell: pwsh
        env:
          SIGN_CERT_SUBJECT: ${{ secrets.SIGN_CERT_SUBJECT }}
        run: pwsh -File scripts/sign-publish-artifacts.ps1 -PublishDir publish/win-x64

      - name: Generate SBOM (CycloneDX)
        shell: pwsh
        run: pwsh -File scripts/generate-sbom.ps1 -OutputDir sbom

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optiSCAN-sbom-${{ github.sha }}
          path: sbom/*.json
          retention-days: 90

      - name: Upload publish artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optiSCAN-win-x64-${{ github.sha }}
          path: publish/win-x64/
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optiSCAN-setup-${{ github.sha }}
          path: installer/output/*.exe
          retention-days: 14

  engine-docker-smoke:
    name: ClamAV/YARA Docker smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and run engine smoke image
        run: |
          docker build -t optiscan-engine-tests -f docker/clamav-yara-tests/Dockerfile .
          docker run --rm optiscan-engine-tests

  sonar:
    name: SonarQube scan (optional)
    runs-on: windows-latest
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && vars.SONAR_ENABLED == 'true'
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"optiSCAN"
          /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      - run: dotnet build optiSCAN.sln -c Release
      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
