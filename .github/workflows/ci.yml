name: CI — Build, Test & Publish

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore optiSCAN.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build optiSCAN.sln --configuration Release --no-restore

      # Moteurs réels (sans freshclam) : les tests de détection EICAR doivent vraiment détecter,
      # pas sortir en succès faute de moteur (audit A6).
      - name: Fetch ClamAV and YARA engines (no signatures)
        shell: pwsh
        run: pwsh -File scripts/fetch-runtime-deps.ps1 -RequireSignature

      - name: Run tests (Release)
        env:
          OPTISCAN_REQUIRE_ENGINES: '1'
        run: >
          dotnet test
          --project optiSCAN.Tests/optiSCAN.Tests.csproj
          --configuration Release
          --no-build
          --results-directory TestResults
          --
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-exclude "[*.Tests]*"
          --coverlet-exclude "[*]optiSCAN.App*"
          --coverlet-exclude-by-file "**/obj/**"
          --coverlet-exclude-by-file "**/*g.cs"
          --coverlet-exclude-by-file "**/*g.i.cs"
          --coverlet-exclude-by-file "**/Migrations/**"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura*.xml
          retention-days: 14

      - name: Code coverage summary and threshold
        if: always()
        shell: pwsh
        run: |
          $floor = 0.40
          $target = 0.50
          $file = Get-ChildItem -Path TestResults -Recurse -Filter 'coverage.cobertura*.xml' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) {
            Write-Error "No coverage file found."
            exit 1
          }
          [xml]$xml = Get-Content $file.FullName
          $lineRate = [double]$xml.coverage.'line-rate'
          $branchRate = [double]$xml.coverage.'branch-rate'
          Write-Host ("Line coverage: {0:P1} (floor {1:P0}, target {2:P0})" -f $lineRate, $floor, $target)
          Write-Host ("Branch coverage: {0:P1}" -f $branchRate)
          if ($lineRate -lt $target) {
            Write-Host "::warning::Line coverage below progressive target ($([int]($target * 100))%)."
          }
          if ($lineRate -lt $floor) {
            Write-Error "Line coverage below minimum floor."
            exit 1
          }

      - name: Build (Debug)
        run: dotnet build optiSCAN.sln --configuration Debug --no-restore

      - name: Upload Release build (dev)
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optiSCAN-Release-build-${{ github.sha }}
          path: optiSCAN/bin/Release/
          retention-days: 7

  publish:
    name: Publish win-x64 (Release)
    runs-on: windows-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore optiSCAN.sln

      - name: Clean publish folders
        shell: pwsh
        run: pwsh -File scripts/clean-before-publish.ps1 -IncludeObj -IncludeCiPublish

      - name: Fetch ClamAV, YARA and signatures (freshclam)
        shell: pwsh
        run: pwsh -File scripts/fetch-runtime-deps.ps1 -RequireSignature -RunFreshclam -FreshclamTimeoutMinutes 45

      - name: Publish win-x64 (self-contained)
        run: >
          dotnet publish optiSCAN/optiSCAN.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:OptiscanShipping=true
          --output publish/win-x64

      - name: Publish protection service (win-x64)
        run: >
          dotnet publish optiSCAN.Service/optiSCAN.Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:OptiscanShipping=true
          --output publish/win-x64

      - name: Publish SYSTEM host (win-x64, no WPF)
        run: >
          dotnet publish optiSCAN.Host/optiSCAN.Host.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:OptiscanShipping=true
          --output publish/win-x64

      - name: Verify shipped binary has no test hooks
        shell: pwsh
        run: |
          foreach ($dll in 'publish/win-x64/optiSCAN.dll', 'publish/win-x64/optiSCAN.Engine.dll', 'publish/win-x64/optiSCAN.Host.dll') {
            if (Select-String -LiteralPath $dll -Pattern 'ClamdLoopbackStub' -SimpleMatch -Quiet) {
              throw "Le binaire publié $dll contient encore le faux clamd des tests (OPTISCAN_TEST_HOOKS)."
            }
          }
          Write-Host 'OK : aucun point d''entrée de test dans le binaire publié.'

      # Aucune signature dans la CI de développement : les releases sont signées par SignPath
      # dans release.yml, sur un tag (docs/CODE_SIGNING_POLICY.md).

      - name: Build AMSI provider (C++, required)
        shell: pwsh
        run: |
          pwsh -File scripts/build-amsi.ps1 -Require
          pwsh -File scripts/stage-amsi.ps1 -PublishDir publish/win-x64
          if (-not (Test-Path publish/win-x64/optiSCAN.AmsiProvider.dll)) { throw 'optiSCAN.AmsiProvider.dll absent du publish.' }

      - name: Stage runtime deps into publish folder
        shell: pwsh
        run: pwsh -File scripts/stage-runtime-deps.ps1 -PublishDir publish/win-x64

      - name: Verify runtime dependencies (ClamAV + YARA)
        shell: pwsh
        run: pwsh -File scripts/verify-runtime-deps.ps1 -PublishDir publish/win-x64

      - name: Install Inno Setup 6
        # Version épinglée de l'outil qui produit l'installateur.
        run: choco install innosetup --version 6.7.1 -y --no-progress

      - name: Build installer (Inno Setup, unsigned)
        shell: pwsh
        run: |
          pwsh -File installer/build-release-setup.ps1 -SkipPublish -PublishDir publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SBOM (CycloneDX)
        shell: pwsh
        run: pwsh -File scripts/generate-sbom.ps1 -OutputDir sbom

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optiSCAN-sbom-${{ github.sha }}
          path: sbom/*.json
          retention-days: 90

      - name: Upload publish artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optiSCAN-win-x64-${{ github.sha }}
          path: publish/win-x64/
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optiSCAN-setup-${{ github.sha }}
          path: installer/output/*.exe
          retention-days: 14
