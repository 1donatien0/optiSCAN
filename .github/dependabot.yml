version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # PDFsharp/MigraDoc passent en AGPL + licence commerciale à partir de 6.3 :
      # rester sur la dernière version MIT (licence libre sans double licence commerciale).
      - dependency-name: "PDFsharp*"
        versions: [">= 6.3.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
